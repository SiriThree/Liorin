[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liorin"
version = "0.1.0"
description = "LangGraph customer support agent for TechHub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.10",
    "langchain-core>=1.3.3",
    "langchain-anthropic>=1.4.6",
    "langchain-openai>=1.1.14",
    "langgraph>=0.2.0",
    "langsmith>=0.8.18",
    "langchain-huggingface>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.2.2",
    "langgraph-cli[inmem]>=0.4.4",
    "agentevals>=0.0.9",
    "openevals>=0.0.9",
]

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["tools", "agents", "deployments", "evaluators"]
