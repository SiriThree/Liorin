name: Evaluation Contract Gate

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'tools/**'
      - 'retrieval/**'
      - 'context_engine/**'
      - 'memory/**'
      - 'artifact/**'
      - 'governance/**'
      - 'observability/**'
      - 'production/**'
      - 'deployments/**'
      - 'eval_platform/**'
      - 'evals/**'
      - 'tests/evaluation/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --dev
      - name: Canonical dataset validation
        run: uv run python -m eval_platform.cli validate --dataset evals/benchmark/data/canonical/validation_v7_3_canonical_v1.json
      - name: Evaluation contracts and zero-tolerance fixtures
        run: uv run pytest -q tests/evaluation
      - name: External quality evaluation status
        run: |
          echo "CONTRACT GATE PASS"
          echo "EXTERNAL QUALITY EVAL SKIPPED on ordinary PR CI; no mock fallback is permitted."
