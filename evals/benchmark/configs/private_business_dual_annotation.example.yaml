annotator_a:
  agent_id: private_gold_annotator_a
  role: annotator
  backend: openai_compatible
  provider: provider-a
  model: model-a
  base_url: https://api.provider-a.example/v1
  api_key_env: ANNOTATOR_A_API_KEY
  prompt_profile: private_gold_review_v1
  temperature: 0.0
  max_tokens: 5000
  timeout_seconds: 120
  max_retries: 4

annotator_b:
  agent_id: private_gold_annotator_b
  role: annotator
  backend: openai_compatible
  provider: provider-b
  model: model-b
  base_url: https://api.provider-b.example/v1
  api_key_env: ANNOTATOR_B_API_KEY
  prompt_profile: private_gold_review_v1
  temperature: 0.0
  max_tokens: 5000
  timeout_seconds: 120
  max_retries: 4

max_concurrency: 2
max_validation_attempts: 3
allow_same_model_independent_runs: false
